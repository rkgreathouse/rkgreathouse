name: Refresh README figures

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/figures.yml"

permissions:
  contents: write

concurrency:
  group: figures
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install font tools
        run: pip install -r scripts/requirements.txt

      - name: Fetch the contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: python scripts/fetch_contributions.py

      - name: Build the figures
        run: python scripts/build_figures.py

      - name: Commit what changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets data
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Refresh contribution figure"
            git push
          fi
